name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "PKG_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify pyproject.toml version matches the tag
        run: |
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG_VERSION="${{ steps.version.outputs.PKG_VERSION }}"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::pyproject.toml version ($PYPROJECT_VERSION) does not match tag ($TAG_VERSION) — bump pyproject.toml before tagging."
            exit 1
          fi

      - name: Categorize Conventional Commits
        id: changelog
        run: |
          # Get previous tag or default to first commit if this is the first release
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.ref_name }}^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          
          # Extract commit subjects between previous tag and current tag
          COMMITS=$(git log "${PREV_TAG}..${{ github.ref_name }}" --format="%s")

          # Temporary buffers for each category
          FEAT=""
          FIX=""
          DOCS=""
          REFACTOR=""
          PERF=""
          CHORE=""
          UNCATEGORIZED=""

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            case "$msg" in
              feat*|Feat*) FEAT="${FEAT}- ${msg}\n" ;;
              fix*|Fix*) FIX="${FIX}- ${msg}\n" ;;
              docs*|Docs*) DOCS="${DOCS}- ${msg}\n" ;;
              refactor*|Refactor*) REFACTOR="${REFACTOR}- ${msg}\n" ;;
              perf*|Perf*) PERF="${PERF}- ${msg}\n" ;;
              chore*|Chore*) CHORE="${CHORE}- ${msg}\n" ;;
              *) UNCATEGORIZED="${UNCATEGORIZED}- ${msg}\n" ;;
            esac
          done <<< "$COMMITS"

          # Build final release notes output
          NOTES=""
          
          # Check for CHANGELOG.md entry first as primary note if it exists
          VERSION_NUM="${{ steps.version.outputs.PKG_VERSION }}"
          if [ -f CHANGELOG.md ]; then
            CL_ENTRY=$(awk "/^## \[${VERSION_NUM}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
            if [ -n "$CL_ENTRY" ]; then
              NOTES="${CL_ENTRY}\n\n### Commit History\n"
            fi
          fi

          [ -n "$FEAT" ] && NOTES="${NOTES}#### 🚀 Features\n${FEAT}\n"
          [ -n "$FIX" ] && NOTES="${NOTES}#### 🐛 Bug Fixes\n${FIX}\n"
          [ -n "$PERF" ] && NOTES="${NOTES}#### ⚡ Performance Improvements\n${PERF}\n"
          [ -n "$REFACTOR" ] && NOTES="${NOTES}#### ♻️ Refactoring\n${REFACTOR}\n"
          [ -n "$DOCS" ] && NOTES="${NOTES}#### 📚 Documentation\n${DOCS}\n"
          [ -n "$CHORE" ] && NOTES="${NOTES}#### 🔧 Chores & Maintenance\n${CHORE}\n"
          [ -n "$UNCATEGORIZED" ] && NOTES="${NOTES}#### ❓ Uncategorized Changes\n${UNCATEGORIZED}\n"

          {
            echo "NOTES<<EOF"
            printf '%b' "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v5.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          body: |
            ${{ steps.changelog.outputs.NOTES }}

            ---

            **Install this release directly — no clone needed:**
            ```bash
            pip install [https://github.com/$](https://github.com/$){{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/ollama_usage-${{ steps.version.outputs.PKG_VERSION }}-py3-none-any.whl
            ```

            Or with `uv`, isolated in its own environment:
            ```bash
            uv tool install ollama-usage --from [https://github.com/$](https://github.com/$){{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/ollama_usage-${{ steps.version.outputs.PKG_VERSION }}-py3-none-any.whl
            ```

            Checksums for all assets are in `SHA256SUMS.txt` below.
          draft: false
          prerelease: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
