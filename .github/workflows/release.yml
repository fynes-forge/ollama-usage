name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "PKG_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify pyproject.toml version matches the tag
        run: |
          PYPROJECT_VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          TAG_VERSION="${{ steps.version.outputs.PKG_VERSION }}"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::pyproject.toml version ($PYPROJECT_VERSION) does not match tag ($TAG_VERSION) — bump pyproject.toml before tagging."
            exit 1
          fi

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[${VERSION#v}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          {
            echo "NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          body: |
            ${{ steps.changelog.outputs.NOTES }}

            ---

            **Install this release directly — no clone needed:**
            ```bash
            pip install https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/ollama_usage-${{ steps.version.outputs.PKG_VERSION }}-py3-none-any.whl
            ```

            Or with `uv`, isolated in its own environment:
            ```bash
            uv tool install ollama-usage --from https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/ollama_usage-${{ steps.version.outputs.PKG_VERSION }}-py3-none-any.whl
            ```

            Checksums for all assets are in `SHA256SUMS.txt` below.
          draft: false
          prerelease: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
