[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[project]
name = "ollama-usage"
version = "0.1.0"
description = "Log, budget, and visualise token usage for local Ollama models."
readme = "README.md"
authors = [
  { name = "Tom Fynes", email = "tom@fynesforge.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "duckdb>=1.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "streamlit>=1.35",
    "typer>=0.12",
]


[project.urls]
Homepage = "https://fynes-forge.github.io"
Repository = "https://github.com/fynes-forge/ollama_usage"
Issues = "https://github.com/fynes-forge/ollama_usage/issues"


[project.scripts]
ollama-usage = "ollama_usage.cli:app"

