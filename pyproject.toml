[build-system]
requires = ["uv_build>=0.11.7,<0.13.0"]
build-backend = "uv_build"

[project]
name = "ollama-usage"
version = "1.0.0"
license = "MIT"
description = "Log, budget, and visualise token usage for local Ollama models."
readme = "README.md"
authors = [
  { name = "Tom Fynes", email = "contact@fynesforge.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "flask>=3.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "plotly>=5.20",
    "requests>=2.31",
    "rich>=13.7",
    "streamlit>=1.35",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://fynes-forge.github.io"
Repository = "https://github.com/fynes-forge/ollama_usage"
Issues = "https://github.com/fynes-forge/ollama_usage/issues"
Blog = "https://fynesforge.dev/blog"

[project.scripts]
ollama-usage = "ollama_usage.cli:app"


[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort (import sorting)
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade (enforces modern syntax)
  "G",      # flake8-logging-format
  "RUF",    # Ruff-specific rules
  "SIM",    # flake8-simplify
]
ignore = [
    "G004",   # Allow f-strings in logging calls
    "RUF001", # Allow ambiguous unicode characters (e.g. '›' CLI prompts)
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["ollama_usage"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "C408"]
"dashboard.py" = ["E501"]  # Ignore line length in HTML/CSS block templates

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true